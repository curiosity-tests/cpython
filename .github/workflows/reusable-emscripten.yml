name: Reusable Emscripten

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: CrashOverride chalk profile
        type: string
        default: curiosity-tests-racecar

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}
  FORCE_COLOR: 1

jobs:
  build-emscripten-reusable:
    name: 'build and test'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        persist-credentials: false
    - name: "Read Emscripten config"
      id: emscripten-config
      shell: python
      run: |
        import hashlib
        import json
        import os
        import tomllib
        from pathlib import Path

        config = tomllib.loads(Path("Platforms/emscripten/config.toml").read_text())
        h = hashlib.sha256()
        h.update(json.dumps(config["dependencies"], sort_keys=True).encode())
        h.update(Path("Platforms/emscripten/make_libffi.sh").read_bytes())
        h.update(b'1') # Update to explicitly bust cache
        emsdk_cache = Path(os.environ["RUNNER_TEMP"]) / "emsdk-cache"
        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"emscripten-version={config['emscripten-version']}\n")
            f.write(f"node-version={config['node-version']}\n")
            f.write(f"deps-hash={h.hexdigest()}\n")
        with open(os.environ["GITHUB_ENV"], "a") as f:
            f.write(f"EMSDK_CACHE={emsdk_cache}\n")
    - name: "Install Node.js"
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: ${{ steps.emscripten-config.outputs.node-version }}
    - name: "Cache Emscripten SDK"
      id: emsdk-cache
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ env.EMSDK_CACHE }}
        key: emsdk-${{ steps.emscripten-config.outputs.emscripten-version }}-${{ steps.emscripten-config.outputs.deps-hash }}
        restore-keys: emsdk-${{ steps.emscripten-config.outputs.emscripten-version }}
    - name: "Install Python"
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.x'
    - name: "Runner image version"
      run: echo "IMAGE_OS_VERSION=${ImageOS}-${ImageVersion}" >> "$GITHUB_ENV"
    - name: "Install Emscripten"
      run: python3 Platforms/emscripten install-emscripten
    - name: "Configure build Python"
      run: python3 Platforms/emscripten configure-build-python -- --config-cache --with-pydebug
    - name: "Make build Python"
      run: python3 Platforms/emscripten make-build-python
    - name: "Display build info of the build Python"
      run: python3 Platforms/emscripten pythoninfo-build
    - name: "Make dependencies"
      run: >-
        python3 Platforms/emscripten make-dependencies
        ${{ steps.emsdk-cache.outputs.cache-hit == 'true' && '--check-up-to-date' || '' }}
    - name: "Configure host/Emscripten Python"
      run: python3 Platforms/emscripten configure-host --host-runner node -- --config-cache
    - name: "Make host/Emscripten Python"
      run: python3 Platforms/emscripten make-host
    - name: "Display build info of the host/Emscripten Python"
      run: python3 Platforms/emscripten pythoninfo-host
    - name: "Test"
      run: python3 Platforms/emscripten run --test
    - name: "Test Repl"
      run: Platforms/emscripten/browser_test/run_test.sh
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
